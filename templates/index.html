<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Correção de Notas</title>
</head>
<body>

    <h1>Sistema de Correção de Notas</h1>

    <h2>Cadastro do Aluno</h2>

    <label>Nome do aluno:</label><br>
    <input type="text" id="nome"><br><br>

    <label>Turma:</label><br>
    <input type="text" id="turma"><br><br>

    <label>Total de atividades propostas:</label><br>
    <input type="number" id="total"><br><br>

    <label>Atividades realizadas:</label><br>
    <input type="number" id="realizadas"><br><br>

    <button onclick="calcularMedia()">Calcular média</button>

    <h2 id="resultado">Média: 0.00</h2>
    <h2 id="situacao">Situação:</h2>

    <hr>

    <p>Escaneie o QR Code para enviar foto da atividade:</p>
    <img src="{{ qr_code }}" alt="QR Code" width="200">

    <br><br>
    <a href="/upload">Abrir página de envio</a>

    <script>
        function calcularMedia() {
            let total = Number(document.getElementById("total").value);
            let realizadas = Number(document.getElementById("realizadas").value);

            if (total <= 0) {
                alert("Digite o total de atividades propostas.");
                return;
            }

            let media = (realizadas / total) * 10;

            document.getElementById("resultado").innerText =
                "Média: " + media.toFixed(2);

            if (media < 6) {
                document.getElementById("situacao").innerText =
                    "Situação: média insuficiente. O aluno precisa fazer compensação de falta.";
            } else {
                document.getElementById("situacao").innerText =
                    "Situação: média suficiente. O aluno não precisa de compensação.";
            }
        }
    </script>

</body>
</html>
